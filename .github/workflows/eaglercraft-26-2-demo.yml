name: Build and publish Eaglercraft 26.2 demo

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/eaglercraft-26-2-demo.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test workspace
        uses: actions/checkout@v4
        with:
          repository: NT9712/eaglercraft-262-workspace
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build TeaVM JavaScript client
        run: |
          chmod +x ./gradlew
          ./gradlew :target_teavm_javascript:buildEaglerJS
          ./gradlew :target_teavm_javascript:stageClient

      - name: Verify generated client
        run: |
          test -f dist/client/index.html
          test -f dist/client/classes.js
          echo "Generated client:"
          du -sh dist/client
          find dist/client -maxdepth 2 -type f | sort | head -50

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
